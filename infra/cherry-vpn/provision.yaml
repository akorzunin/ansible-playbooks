---
- name: Validate recovery inputs before provisioning the dynamic node
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files: [vars.yaml]
  tasks:
    - name: Check the controller and existing encrypted state
      ansible.builtin.import_tasks: tasks/lifecycle-preflight.yaml

- name: Restore the existing administrator and tunnel keys
  ansible.builtin.import_playbook: restore-keys.yaml

- name: Provision only the selected dynamic VM
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files: [vars.yaml]
  vars:
    dyn_operation: deploy
  tasks:
    - name: Prepare a fresh server identity only when no VM is tracked
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/prepare-bootstrap.py", --vault, "{{ dyn_root }}/secrets.vault.yaml", --rotate-host-key]
      when: "'cherryservers_server.vpn' not in dyn_tracked_resources.stdout_lines"
      changed_when: true

    - name: Plan and approve creation without permitting in-place changes or replacement
      ansible.builtin.import_tasks: tasks/lifecycle-plan.yaml

    - name: Apply and back up the approved state
      ansible.builtin.import_tasks: tasks/lifecycle-apply.yaml

    - name: Generate strict SSH pins and inventory from applied state
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/tofu.sh", --node, "{{ dyn_name }}", inventory]
      changed_when: true

    - name: Load the generated isolated inventory
      ansible.builtin.include_vars:
        file: "{{ dyn_private }}/inventory.yaml"
        name: dyn_inventory

    - name: Add only the applied dynamic VM to this run
      vars:
        dyn_host: "{{ dyn_inventory.all.children.vpn_test.hosts[dyn_name] }}"
      ansible.builtin.add_host:
        name: "{{ dyn_name }}"
        groups: vpn_test
        ansible_host: "{{ dyn_host.ansible_host }}"
        ansible_user: "{{ dyn_host.ansible_user }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ dyn_host.ansible_ssh_private_key_file }}"
        ansible_ssh_common_args: "{{ dyn_host.ansible_ssh_common_args }}"
        ansible_host_key_checking: true
        provider_server_id: "{{ dyn_host.provider_server_id }}"

- name: Bootstrap administration and configure VPN services and monitoring
  ansible.builtin.import_playbook: deploy.yaml

- name: Verify the dynamic node before registering it alongside existing exits
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files: [vars.yaml]
  tasks:
    - name: Test isolated authenticated exits and VLESS UDP without switching the active client
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../roles/vpn_node/files/check.py"
          - --input
          - "{{ dyn_private }}/{{ dyn_name }}-outbounds.json"
          - --node
          - "{{ dyn_name }}"
          - --expected-ip
          - "{{ hostvars[dyn_name].ansible_host }}"
          - --udp
      changed_when: false

    - name: Register only this node while preserving unrelated exits and enrollment tokens
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../playbooks/sing-box-configs/register-node.py"
          - --node
          - "{{ dyn_name }}"
          - --outbounds-file
          - "{{ dyn_private }}/{{ dyn_name }}-outbounds.json"
          - --migrate-cherry
      register: dyn_registration
      changed_when: "'source updated' in dyn_registration.stdout"
      no_log: true

- name: Publish tested dynamic choices with unchanged enrollment URLs
  ansible.builtin.import_playbook: ../../playbooks/sing-box-configs/deploy.yaml

- name: Verify all published dynamic choices
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files: [vars.yaml]
  tasks:
    - name: Test generated choices including VLESS UDP and the workstation SSH hop
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../roles/vpn_node/files/check.py"
          - --input
          - "{{ playbook_dir }}/../../playbooks/sing-box-configs/private/linux.json"
          - --node
          - "{{ dyn_name }}"
          - --expected-ip
          - "{{ hostvars[dyn_name].ansible_host }}"
          - --udp
      changed_when: false

    - name: Explain the client refresh boundary
      ansible.builtin.debug:
        msg: "{{ dyn_name }} is published as {{ dyn_name }}-*; refresh your remote profile. No active client was switched."
