---
- name: Validate recovery inputs before provisioning dyn1
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Check the controller and existing encrypted state
      ansible.builtin.import_tasks: tasks/lifecycle-preflight.yaml

- name: Restore the existing administrator and tunnel keys
  ansible.builtin.import_playbook: restore-keys.yaml

- name: Provision only the dedicated dyn1 VM
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    dyn1_operation: deploy
  tasks:
    - name: Prepare a fresh server identity only when no VM is tracked
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/prepare-bootstrap.py", --rotate-host-key]
      when: "'cherryservers_server.vpn' not in dyn1_tracked_resources.stdout_lines"
      changed_when: true

    - name: Plan and approve creation without permitting in-place changes or replacement
      ansible.builtin.import_tasks: tasks/lifecycle-plan.yaml

    - name: Apply and back up the approved state
      ansible.builtin.import_tasks: tasks/lifecycle-apply.yaml

    - name: Generate strict SSH pins and inventory from applied state
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/tofu.sh", inventory]
      changed_when: true

    - name: Load the generated isolated inventory
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/private/inventory.yaml"
        name: dyn1_inventory

    - name: Add only the applied Cherry VM to this run
      vars:
        dyn1_host: "{{ dyn1_inventory.all.children.vpn_test.hosts.cherry_vpn_test }}"
      ansible.builtin.add_host:
        name: cherry_vpn_test
        groups: vpn_test
        ansible_host: "{{ dyn1_host.ansible_host }}"
        ansible_user: "{{ dyn1_host.ansible_user }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ dyn1_host.ansible_ssh_private_key_file }}"
        ansible_ssh_common_args: "{{ dyn1_host.ansible_ssh_common_args }}"
        ansible_host_key_checking: true
        cherry_server_id: "{{ dyn1_host.cherry_server_id }}"

- name: Bootstrap administration and configure VPN services and monitoring
  ansible.builtin.import_playbook: deploy.yaml

- name: Verify dyn1 before registering it alongside existing exits
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Test isolated authenticated exits without switching the active client
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../roles/vpn_node/files/check.py"
          - --input
          - "{{ playbook_dir }}/private/cherry-outbounds.json"
          - --node
          - cherry
          - --expected-ip
          - "{{ hostvars['cherry_vpn_test'].ansible_host }}"
      changed_when: false

    - name: Register only Cherry entries while preserving the current profile default and tokens
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../playbooks/sing-box-configs/register-node.py"
          - --node
          - cherry
          - --outbounds-file
          - "{{ playbook_dir }}/private/cherry-outbounds.json"
      register: dyn1_registration
      changed_when: "'source updated' in dyn1_registration.stdout"
      no_log: true

- name: Publish tested dyn1 choices with unchanged enrollment URLs and default
  ansible.builtin.import_playbook: ../../playbooks/sing-box-configs/deploy.yaml

- name: Verify all published dyn1 choices
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Test generated direct and chained choices including the workstation SSH hop
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../roles/vpn_node/files/check.py"
          - --input
          - "{{ playbook_dir }}/../../playbooks/sing-box-configs/private/linux.json"
          - --node
          - cherry
          - --expected-ip
          - "{{ hostvars['cherry_vpn_test'].ansible_host }}"
      changed_when: false

    - name: Explain the client refresh boundary
      ansible.builtin.debug:
        msg: dyn1 is published as cherry-*; refresh your remote profile and select it explicitly. No active client was switched.
