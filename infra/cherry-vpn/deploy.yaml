---
# Establish and verify key-only sudo access before running the full reusable role.
- name: Bootstrap the isolated node and verify administrator access
  ansible.builtin.import_playbook: ../../playbooks/vpn-probe/deploy.yaml

- name: Deploy all four VPN protocols on the verified Cherry administrator connection
  hosts: vpn_test_admin
  become: true
  become_flags: -n
  vars:
    ansible_host_key_checking: true
    vpn_node_name: cherry
    vpn_node_domain: akorz-dyn1.duckdns.org
  pre_tasks:
    # The imported bootstrap has verified a fresh non-root connection and sudo.
    # Update the manual-access alias too, not only the disposable vpn_test inventory.
    - name: Refresh dyn1 access after verified administrator bootstrap
      ansible.builtin.blockinfile:
        path: "{{ playbook_dir }}/../../hosts"
        marker: "# {mark} ANSIBLE BOOTSTRAP dyn1"
        block: |
          bootstrap_dyn1:
            hosts:
              dyn1:
                ansible_host: {{ ansible_host | to_json }}
                ansible_port: {{ ansible_port | default(22) | int }}
                ansible_user: {{ ansible_user | to_json }}
                ansible_python_interpreter: /usr/bin/python3
                ansible_ssh_private_key_file: {{ ansible_ssh_private_key_file | to_json }}
                ansible_ssh_common_args: {{ ansible_ssh_common_args | to_json }}
        backup: true
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Load shared external variables for DuckDNS
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../external_vars.yml"
      no_log: true

    - name: Load shared VPN credentials without exposing them in logs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.vault.yaml"
      no_log: true
    - name: Load the shared Hysteria 2 credential without rotating it per node
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/hysteria2.vault.yaml"
      no_log: true
  roles:
    - vpn_node

- name: Register metrics and deploy workstation reachability alerts
  ansible.builtin.import_playbook: monitoring.yaml
