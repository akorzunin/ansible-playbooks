---
- name: Apply only the reviewed saved plan and preserve recovery state even on failure
  block:
    - name: Apply the approved encrypted plan
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/tofu.sh", apply, -input=false, -no-color, private/lifecycle.tfplan]
      changed_when: true
  always:
    - name: Back up encrypted state after the apply attempt
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/tofu.sh", backup-state]
      changed_when: true
