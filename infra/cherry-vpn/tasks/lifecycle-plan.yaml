---
- name: Save an encrypted lifecycle plan without interactive variable prompts
  ansible.builtin.command:
    argv: >-
      {{ ['bash', playbook_dir ~ '/tofu.sh', '--node', dyn_name, 'plan', '-input=false', '-no-color',
          '-out=private/lifecycle.tfplan',
          '-var=allocation_checks=' ~
          ('true' if dyn_operation == 'deploy' and
           'cherryservers_server.vpn' not in dyn_tracked_resources.stdout_lines else 'false')] +
         (['-destroy'] if dyn_operation == 'destroy' else []) }}
  changed_when: false
  no_log: true

- name: Reject unsafe actions and extract a non-secret plan summary
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/tofu.sh"
      - --node
      - "{{ dyn_name }}"
      - review-plan
      - "{{ dyn_operation }}"
      - private/lifecycle.tfplan
  register: dyn_plan_review
  changed_when: false

- name: Show the exact resource actions and catalogue compute quote
  ansible.builtin.debug:
    msg: "{{ dyn_plan_review.stdout | from_json }}"

- name: Wait for explicit approval of the saved plan
  ansible.builtin.pause:
    prompt: >-
      Check {{ dyn_name }}'s project, region, plan and account price above.
      {{ 'Billing starts at apply; configuration failures do not stop billing.' if dyn_operation == 'deploy'
         else 'Profiles and monitoring will be retired before deletion; clients must refresh.' }}
      Type '{{ dyn_operation }} {{ dyn_name }}' to continue, anything else to abort
  register: dyn_approval

- name: Require a typed approval even on noninteractive runs
  ansible.builtin.assert:
    that: dyn_approval.user_input | default('') == dyn_operation ~ ' ' ~ dyn_name
    fail_msg: Not approved; no apply or profile changes were performed.
