services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls322@sha256:ff4430fe2d6159b4dbaac9903acfecee5aa68dec8c929259e2f3114c63f7a09e
    environment: &arr_environment
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      HTTP_PROXY: http://host.docker.internal:20171
      HTTPS_PROXY: http://host.docker.internal:20171
      NO_PROXY: localhost,127.0.0.1,radarr,sonarr,prowlarr,bazarr,flaresolverr,host.docker.internal
    volumes:
      - ./config/radarr:/config
      - /mnt/storage/jellyfin_media:/downloads
    ports:
      - "${ARR_BIND_IP:-127.0.0.1}:7878:7878"
    extra_hosts: &host_gateway
      - host.docker.internal:host-gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "2.0"
          memory: 2G

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    environment: *arr_environment
    volumes:
      - ./config/sonarr:/config
      - /mnt/storage/jellyfin_media:/downloads
    ports:
      - "${ARR_BIND_IP:-127.0.0.1}:8989:8989"
    extra_hosts: *host_gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "2.0"
          memory: 2G

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls164@sha256:4e992f9b9229bc8c97c666b10b042a7360bce1d99b196e8aa29fd9805849cbf1
    environment: *arr_environment
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${ARR_BIND_IP:-127.0.0.1}:9696:9696"
    extra_hosts: *host_gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.0"
          memory: 1G

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      LOG_LEVEL: warning
      TZ: ${TZ:-Etc/UTC}
    extra_hosts: *host_gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "2.0"
          memory: 1G

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls368@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9
    environment: *arr_environment
    volumes:
      - ./config/bazarr:/config
      - /mnt/storage/jellyfin_media:/downloads
    ports:
      - "${ARR_BIND_IP:-127.0.0.1}:6767:6767"
    extra_hosts: *host_gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.0"
          memory: 1G

  bot:
    profiles: [bot]
    image: ghcr.io/akorzunin/arr-telegram-bot:45250e755117a625d21f2a50c771089317476ee9
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    env_file: bot.env
    environment:
      PREPARATION_DIR: ${ARR_PREPARATION_DIR:-}
      RADARR_URL: http://radarr:7878
      SONARR_URL: http://sonarr:8989
      TRANSMISSION_URL: http://host.docker.internal:9092/transmission/rpc
      RADARR_ROOT: /downloads/complete/films
      SONARR_ROOT: /downloads/complete/shows
      HTTP_PROXY: http://host.docker.internal:20171
      HTTPS_PROXY: http://host.docker.internal:20171
      NO_PROXY: localhost,127.0.0.1,radarr,sonarr,prowlarr,bazarr,flaresolverr,host.docker.internal
    extra_hosts: *host_gateway
    volumes:
      - ./config/bot:/state
      - ./config/preparation:/preparation
      - /mnt/storage/jellyfin_media:/downloads:ro
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 256M
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  prepare:
    profiles: [prepare]
    image: ghcr.io/akorzunin/arr-telegram-bot:worker-45250e755117a625d21f2a50c771089317476ee9
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    env_file: worker.env
    environment:
      JELLYFIN_URL: http://host.docker.internal:8096
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,utility,compute
    extra_hosts: *host_gateway
    volumes:
      - ./config/preparation:/preparation
      - /mnt/storage/jellyfin_media:/downloads:ro
      - type: bind
        source: /mnt/storage/jellyfin_optimized
        target: /optimized
        bind:
          create_host_path: false
    runtime: nvidia
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
        limits:
          cpus: "4.0"
          memory: 2G
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
