---
- name: Configure running ARR apps
  hosts: local_workstation,remote_workstation
  become: false
  vars:
    arr_dir: /srv/deploy/arr
    arr_prepare_enabled: false
  vars_files:
    - "{{ playbook_dir }}/../../external_vars.yml"

  tasks:
    - name: Require RuTracker credentials
      ansible.builtin.assert:
        that:
          - RUTRACKER_USER | default('') | length > 0
          - RUTRACKER_PASS | default('') | length > 0
      no_log: true

    - name: Copy app configuration script
      ansible.builtin.copy:
        src: configure.py
        dest: "{{ arr_dir }}/configure.py"
        mode: "0644"

    - name: Configure apps using their local API keys
      ansible.builtin.command:
        cmd: python3 configure.py
        chdir: "{{ arr_dir }}"
      environment:
        RUTRACKER_USER: "{{ RUTRACKER_USER }}"
        RUTRACKER_PASS: "{{ RUTRACKER_PASS }}"
      register: arr_configuration
      changed_when: arr_configuration.rc == 0
      no_log: true

    - name: Show credential-free configuration summary
      ansible.builtin.debug:
        var: arr_configuration.stdout_lines

    - name: Start GPU preparation worker when enabled
      ansible.builtin.command:
        cmd: docker compose --profile prepare up -d --pull always prepare
        chdir: "{{ arr_dir }}"
      when: arr_prepare_enabled | bool
      register: arr_prepare_start
      changed_when: arr_prepare_start.rc == 0
      no_log: true

    - name: Start configured Go Telegram bot from GHCR
      ansible.builtin.command:
        cmd: docker compose --profile bot up -d --pull always bot
        chdir: "{{ arr_dir }}"
      register: arr_bot_start
      changed_when: arr_bot_start.rc == 0
      no_log: true
