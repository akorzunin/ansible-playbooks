---
- name: Deploy v2rayA
  hosts: all
  become: false
  vars:
    deploy_compose_dir: /srv/deploy
    deploy_compose_service_name: v2raya
    network_name: v2raya-proxy
    v2raya_api: http://127.0.0.1:2017
    v2raya_node_address: 3x-ui.akorz-nt1.duckdns.org:16001
  vars_files:
    - "{{ playbook_dir }}/../../external_vars.yml"

  tasks:
    - name: Validate v2rayA bootstrap variables
      ansible.builtin.assert:
        that:
          - V2RAYA_ADMIN_USERNAME is defined
          - V2RAYA_ADMIN_USERNAME | length > 0
          - V2RAYA_ADMIN_PASSWORD is defined
          - V2RAYA_ADMIN_PASSWORD | length > 0
          - V2RAYA_NODE_URL is defined
          - V2RAYA_NODE_URL is match('^vless://')
        quiet: true
      no_log: true

    - name: Create v2rayA deployment directory
      ansible.builtin.include_role:
        name: deploy_compose
        tasks_from: mkdir

    - name: Create v2rayA data directory
      ansible.builtin.file:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data"
        state: directory
        mode: "0700"

    - name: Remove obsolete SSH tunnel files
      ansible.builtin.file:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/{{ item }}"
        state: absent
      loop:
        - Dockerfile.ssh
        - .env
        - ssh-password
        - ssh

    - name: Check shared Docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - "{{ network_name }}"
      register: network_inspect
      changed_when: false
      failed_when: false

    - name: Create shared Docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - "{{ network_name }}"
      when: network_inspect.rc != 0
      changed_when: true

    - name: Deploy v2rayA Compose service
      ansible.builtin.import_role:
        name: deploy_compose

    - name: Wait for v2rayA API
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/version"
        method: GET
        status_code: 200
        use_proxy: false
      register: v2raya_ready
      until: v2raya_ready.status == 200
      retries: 30
      delay: 2

    - name: Check v2rayA account
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/account"
        method: GET
        status_code: 200
        use_proxy: false
      register: v2raya_account
      changed_when: false

    - name: Create v2rayA account
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/account"
        method: POST
        body_format: json
        body:
          username: "{{ V2RAYA_ADMIN_USERNAME }}"
          password: "{{ V2RAYA_ADMIN_PASSWORD }}"
        status_code: 200
        use_proxy: false
      when: not v2raya_account.json.data.hasAnyAccounts
      no_log: true

    - name: Log in to v2rayA
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/login"
        method: POST
        body_format: json
        body:
          username: "{{ V2RAYA_ADMIN_USERNAME }}"
          password: "{{ V2RAYA_ADMIN_PASSWORD }}"
        status_code: 200
        use_proxy: false
      register: v2raya_login
      changed_when: false
      failed_when: v2raya_login.json.code | default('FAIL') != 'SUCCESS'
      no_log: true

    - name: Read configured v2rayA nodes
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/touch"
        method: GET
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        status_code: 200
        use_proxy: false
      register: v2raya_touch
      changed_when: false
      failed_when: v2raya_touch.json.code | default('FAIL') != 'SUCCESS'
      no_log: true

    - name: Find existing VLESS node
      ansible.builtin.set_fact:
        v2raya_existing_id: >-
          {{
            v2raya_touch.json.data.touch.servers
            | selectattr('address', 'equalto', v2raya_node_address)
            | map(attribute='id')
            | list
            | first
            | default(0, true)
          }}

    - name: Import or update VLESS node
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/import"
        method: POST
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        body_format: json
        body: >-
          {{
            {'url': V2RAYA_NODE_URL}
            | combine(
                ({'which': {'_type': 'server', 'id': v2raya_existing_id | int}}
                if (v2raya_existing_id | int > 0) else {})
              )
          }}
        status_code: 200
        use_proxy: false
      register: v2raya_import
      no_log: true
      changed_when: true
      failed_when: v2raya_import.json.code | default('FAIL') != 'SUCCESS'

    - name: Read imported v2rayA node
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/touch"
        method: GET
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        status_code: 200
        use_proxy: false
      register: v2raya_touch_after_import
      changed_when: false
      failed_when: v2raya_touch_after_import.json.code | default('FAIL') != 'SUCCESS'
      no_log: true

    - name: Select VLESS node
      ansible.builtin.set_fact:
        v2raya_node_id: >-
          {{
            v2raya_touch_after_import.json.data.touch.servers
            | selectattr('address', 'equalto', v2raya_node_address)
            | map(attribute='id')
            | list
            | first
          }}

    - name: Read v2rayA settings
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/setting"
        method: GET
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        status_code: 200
        use_proxy: false
      register: v2raya_setting
      changed_when: false
      failed_when: v2raya_setting.json.code | default('FAIL') != 'SUCCESS'
      no_log: true

    - name: Allow proxy access from the Docker network
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/setting"
        method: PUT
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        body_format: json
        body: "{{ v2raya_setting.json.data.setting | combine({'portSharing': true}) }}"
        status_code: 200
        use_proxy: false
      when: not v2raya_setting.json.data.setting.portSharing
      no_log: true
      changed_when: true
      failed_when: v2raya_port_sharing.json.code | default('FAIL') != 'SUCCESS'
      register: v2raya_port_sharing

    - name: Connect VLESS node
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/connection"
        method: POST
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        body_format: json
        body:
          _type: server
          id: "{{ v2raya_node_id | int }}"
          outbound: proxy
        status_code: 200
        use_proxy: false
      register: v2raya_connection
      changed_when: true
      failed_when: v2raya_connection.json.code | default('FAIL') != 'SUCCESS'
      no_log: true

    - name: Start v2ray core
      ansible.builtin.uri:
        url: "{{ v2raya_api }}/api/v2ray"
        method: POST
        headers:
          Authorization: "Bearer {{ v2raya_login.json.data.token }}"
        status_code: 200
        use_proxy: false
      register: v2raya_start
      changed_when: true
      failed_when: v2raya_start.json.code | default('FAIL') != 'SUCCESS'
      no_log: true
