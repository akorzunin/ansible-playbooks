---
- name: Deploy Hermes Agent
  hosts: all
  become: false
  vars:
    deploy_compose_dir: /srv/deploy
    deploy_compose_service_name: hermes-agent
  vars_files:
    - "{{ playbook_dir }}/../../external_vars.yml"

  tasks:
    - name: Check existing Hermes API keys
      ansible.builtin.shell:
        cmd: >-
          grep -q '^OMNIROUTE_API_KEY=.' {{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data/.env
          && grep -q '^FIRECRAWL_API_KEY=.' {{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data/.env
      register: hermes_existing_keys
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check Hermes API keys are configured
      ansible.builtin.assert:
        that:
          - >-
            (HERMES_OMNIROUTE_API_KEY is defined and HERMES_FIRECRAWL_API_KEY is defined)
            or hermes_existing_keys.rc == 0
        quiet: true
      no_log: true

    - name: Create Hermes deployment directory
      ansible.builtin.include_role:
        name: deploy_compose
        tasks_from: mkdir

    - name: Create Hermes data directory
      ansible.builtin.file:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data"
        state: directory
        mode: "0700"

    - name: Copy Hermes Compose file
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/compose.yaml"
        mode: "0644"

    - name: Set Hermes model configuration
      ansible.builtin.copy:
        src: config.yaml
        dest: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data/config.yaml"
        mode: "0600"
        force: true

    - name: Write Hermes OmniRoute key
      ansible.builtin.lineinfile:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data/.env"
        regexp: "^OMNIROUTE_API_KEY="
        line: "OMNIROUTE_API_KEY={{ HERMES_OMNIROUTE_API_KEY }}"
        create: true
        mode: "0600"
      when: HERMES_OMNIROUTE_API_KEY is defined
      no_log: true

    - name: Write Hermes Firecrawl key
      ansible.builtin.lineinfile:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data/.env"
        regexp: "^FIRECRAWL_API_KEY="
        line: "FIRECRAWL_API_KEY={{ HERMES_FIRECRAWL_API_KEY }}"
        create: true
        mode: "0600"
      when: HERMES_FIRECRAWL_API_KEY is defined
      no_log: true

    - name: Set Hermes data ownership
      become: true
      ansible.builtin.file:
        path: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}/data"
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        recurse: true

    - name: Start Hermes Agent
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --remove-orphans --wait --wait-timeout 1200
        chdir: "{{ deploy_compose_dir }}/{{ deploy_compose_service_name }}"
      environment:
        HERMES_UID: "{{ ansible_facts['user_uid'] }}"
        HERMES_GID: "{{ ansible_facts['user_gid'] }}"
      register: hermes_compose
      changed_when: hermes_compose.rc == 0
