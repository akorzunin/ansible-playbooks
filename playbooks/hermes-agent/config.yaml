_config_version: 37

providers:
  omniroute:
    api: http://192.168.1.132:20128/v1
    key_env: OMNIROUTE_API_KEY

model:
  provider: custom:omniroute
  default: cx/gpt-5.6-luna-high

fallback_providers:
  - provider: custom:omniroute
    model: deepseek/deepseek-v4-flash

web:
  backend: firecrawl

stt:
  enabled: true
  provider: openai
  openai:
    model: Systran/faster-whisper-large-v3
    base_url: http://speaches:8000/v1
    api_key: not-needed
    language: ""

security:
  allow_lazy_installs: true

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
