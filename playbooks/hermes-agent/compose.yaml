services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    container_name: hermes-agent
    command: ["gateway", "run"]
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HTTP_PROXY: http://host.docker.internal:20171
      HTTPS_PROXY: http://host.docker.internal:20171
      NO_PROXY: 127.0.0.1,localhost,host.docker.internal,192.168.1.132
      TELEGRAM_PROXY: http://host.docker.internal:20171
      HERMES_TELEGRAM_HTTP_CONNECT_TIMEOUT: 30
      HERMES_TELEGRAM_HTTP_READ_TIMEOUT: 60
      HERMES_TELEGRAM_HTTP_WRITE_TIMEOUT: 60
      HERMES_TELEGRAM_HTTP_POOL_TIMEOUT: 30
    volumes:
      - ./data:/opt/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
