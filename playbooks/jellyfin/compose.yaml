services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    ports:
      - 8096:8096
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      # HLS segments must not fill the system disk, even when video is copied.
      - type: bind
        source: /mnt/storage/jellyfin_transcodes
        target: /config/transcodes
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/storage/jellyfin_media
        target: /storage
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/storage/jellyfin_optimized
        target: /optimized
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    runtime: nvidia
    # Track device permissions in Docker, not only the legacy NVIDIA hook.
    # Single-GPU workstation; migrate to CDI for multi-GPU/MIG hardware.
    devices:
      - /dev/nvidia0:/dev/nvidia0:rw
      - /dev/nvidiactl:/dev/nvidiactl:rw
      - /dev/nvidia-uvm:/dev/nvidia-uvm:rw
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
          memory: 700M
        limits:
          memory: 2.0G
