services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    ports:
      - 8096:8096
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      # HLS segments must not fill the system disk, even when video is copied.
      - type: bind
        source: /mnt/storage/jellyfin_transcodes
        target: /config/transcodes
        bind:
          create_host_path: false
      - ./jellyfin/media:/media
      - ./jellyfin/media2:/media2:ro
      - /mnt/storage/jellyfin_media/:/storage:rw
      - type: bind
        source: /mnt/storage/jellyfin_optimized
        target: /optimized
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
          memory: 700M
        limits:
          memory: 2.0G
