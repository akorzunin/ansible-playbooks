---
- name: Restrict the workstation SSH hop to published SSH exits
  hosts: remote_workstation
  become: true
  vars:
    hop_user: sing-box-hop
    hop_ssh: >-
      {{ sing_box_secrets.extra_outbounds |
         selectattr('tag', 'equalto', 'workstation-hop') | first }}
    hop_destinations: >-
      {{ (lookup('ansible.builtin.file', playbook_dir + '/private/linux.json') | from_json).outbounds |
         selectattr('type', 'equalto', 'ssh') | rejectattr('tag', 'equalto', 'workstation-hop') |
         rejectattr('detour', 'defined') | list }}
    hop_permit_open: >-
      {{ hop_destinations | map(attribute='server') |
         zip(hop_destinations | map(attribute='server_port')) | map('join', ':') | join(' ') }}
  tasks:
    - name: Load shared hop credentials
      ansible.builtin.include_vars:
        file: secrets.vault.yaml
      no_log: true

    - name: Validate hop identity and forwarding destination
      ansible.builtin.assert:
        that:
          - hop_ssh.user == hop_user
          - hop_ssh.server == ansible_host
          - hop_ssh.server_port == ansible_port | int
          - hop_ssh.host_key | length > 0
          - hop_destinations | length > 0
          - sing_box_secrets.workstation_ssh_public_key is match('^ssh-ed25519 ')
        quiet: true
      no_log: true

    - name: Validate each published forwarding destination
      ansible.builtin.assert:
        that:
          - item.server is match('^[0-9.]+$')
          - item.server_port | int > 0
          - item.server_port | int < 65536
          - item.host_key | length > 0
        quiet: true
      loop: "{{ hop_destinations }}"
      no_log: true

    - name: Create an unprivileged forwarding-only account
      ansible.builtin.user:
        name: "{{ hop_user }}"
        system: true
        create_home: true
        shell: /usr/sbin/nologin
        password: '*'
        update_password: on_create

    - name: Create a root-managed key directory
      ansible.builtin.file:
        path: "/home/{{ hop_user }}/.ssh"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the shared client key restricted to published SSH exits
      ansible.builtin.copy:
        dest: "/home/{{ hop_user }}/.ssh/authorized_keys"
        content: >-
          restrict,port-forwarding,command="/usr/sbin/nologin"{% for destination in hop_destinations
          %},permitopen="{{ destination.server }}:{{ destination.server_port }}"{% endfor %}
          {{ sing_box_secrets.workstation_ssh_public_key }}
        owner: root
        group: root
        mode: '0644'
      no_log: true

    - name: Validate and install forwarding-only SSH policy
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: '# {mark} sing-box workstation hop'
        validate: /usr/sbin/sshd -t -f %s
        block: |
          Match User {{ hop_user }}
              AuthenticationMethods publickey
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              AllowTcpForwarding local
              AllowStreamLocalForwarding no
              AllowAgentForwarding no
              X11Forwarding no
              PermitTTY no
              PermitTunnel no
              PermitOpen {{ hop_permit_open }}
              MaxSessions 0
          Match all
      notify: Reload SSH
      no_log: true

    - name: Apply hop policy before publishing profiles
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
