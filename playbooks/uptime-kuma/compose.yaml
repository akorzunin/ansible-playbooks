services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    container_name: uptime-kuma
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Match the exported database backend and skip the fresh-install DB wizard.
      UPTIME_KUMA_DB_TYPE: sqlite
      # Notification-only proxy; monitor traffic keeps its existing routing.
      NOTIFICATION_PROXY: http://host.docker.internal:20171
    ports:
      - "3033:3001"
    volumes:
      - ./data:/app/data
