apiVersion: 1

datasources:
  - name: Monitoring Prometheus
    uid: monitoring-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: Monitoring Loki
    uid: monitoring-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
