# Public workstation settings. Outbound credentials come from the shared profile Vault.
listen: 127.0.0.1:8081
api_token_env: VPN_MONITOR_API_TOKEN
sing_box: sing-box
web_dir: web/dist
history_file: data/history.json
interval: 5m
timeout: 10s
samples: 3
speed:
  url: https://speed.cloudflare.com/__down?bytes=4194304
  max_bytes: 4194304
  timeout: 15s
controls:
  - name: example
    url: https://example.com/
    status: 200
  - name: cloudflare
    url: https://www.cloudflare.com/cdn-cgi/trace
    status: 200
targets:
  - name: gstatic
    url: https://www.gstatic.com/generate_204
    status: 204
  - name: cloudflare
    url: https://www.cloudflare.com/cdn-cgi/trace
    status: 200
# GE2 is blocked. Keep the monitor disabled until new targets are explicitly approved.
servers: []
