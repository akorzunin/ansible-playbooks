# Public workstation settings. Outbound credentials come from the shared profile Vault.
listen: 127.0.0.1:8081
api_token_env: VPN_MONITOR_API_TOKEN
sing_box: sing-box
web_dir: web/dist
history_file: data/history.json
interval: 5m
timeout: 10s
samples: 3
speed:
  url: https://speed.cloudflare.com/__down?bytes=4194304
  max_bytes: 4194304
  timeout: 15s
# GE2-local probes measure the tunnel, not onward Internet UDP routing.
udp:
  endpoint: 94.249.187.177:9444
  token_env: VPN_MONITOR_UDP_TOKEN
  samples: 10
  timeout: 1s
controls:
  - name: example
    url: https://example.com/
    status: 200
  - name: cloudflare
    url: https://www.cloudflare.com/cdn-cgi/trace
    status: 200
targets:
  - name: gstatic
    url: https://www.gstatic.com/generate_204
    status: 204
  - name: cloudflare
    url: https://www.cloudflare.com/cdn-cgi/trace
    status: 200
# Explicit allowlist: new published outbounds do not silently become probes.
servers:
  - name: ge2
    protocols:
      - name: ssh
        outbound_tag: ge2-ssh
        udp: false
      - name: naive
        outbound_tag: ge2-naive
        udp: false
      - name: vless
        outbound_tag: ge2-vless
        udp: true
