services:
  client:
    # Same immutable upstream image as the VPN node; includes with_naive_outbound.
    image: ghcr.io/sagernet/sing-box@sha256:0788ffbddab2c68a99a2dd4780bbc50902f159af6f589df3ee74a8389d278279
    command: [run, -c, /etc/vpn/client.json]
    user: "65534:65534"
    restart: unless-stopped
    volumes:
      - /etc/vpn-monitor/client.json:/etc/vpn/client.json:ro
    # No published ports, TUN device, NET_ADMIN or host networking.
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  probe:
    image: cherry-vpn-probe:python3.14
    # Only this container can reach the client's loopback listeners. Direct
    # controls use ordinary Docker egress, not a sing-box outbound or fallback.
    network_mode: service:client
    depends_on:
      client:
        condition: service_started
    command:
      - --proxy
      - ssh=socks5h://127.0.0.1:22340
      - --proxy
      - naive=socks5h://127.0.0.1:22341
      - --proxy
      - vless=socks5h://127.0.0.1:22342
      - --control-url
      - https://example.com/
      - --control-url
      - https://www.wikipedia.org/
      - --continuous
      - --interval
      - "60"
      - --metrics-output
      - /metrics/metrics.prom
    user: "65534:65534"
    init: true
    restart: unless-stopped
    volumes:
      - ./probe.py:/app/probe.py:ro
      - /var/lib/vpn-monitor:/metrics:rw
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
