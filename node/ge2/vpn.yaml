---
vpn_node_domain: akorz-ge2.duckdns.org
# Preserve ge2's existing A/AAAA records and dual-stack application routing.
vpn_node_manage_dns: false
vpn_node_shared_https: true
vpn_node_caddyfile: "{{ playbook_dir }}/../../node/ge2/caddy/Caddyfile"
vpn_node_reality_server_name: akorz-ge2.duckdns.org
vpn_node_ssh_port: 2222
# Caddy already uses UDP/443 for application HTTP/3.
vpn_node_hysteria2_port: 8443
vpn_node_default_outbound: ge2-vless-via-naive
