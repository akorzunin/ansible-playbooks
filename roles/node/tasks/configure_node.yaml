---
- name: Bootstrap Python and sudo on a minimal Debian or Ubuntu image
  ansible.builtin.raw: |
    set -eu
    if ! command -v python3 >/dev/null 2>&1 || ! command -v sudo >/dev/null 2>&1; then
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y python3 sudo
      echo NODE_BOOTSTRAP_CHANGED
    fi
  register: node_python_bootstrap
  changed_when: "'NODE_BOOTSTRAP_CHANGED' in node_python_bootstrap.stdout"

- name: Create key-only administrator without forcing a UID
  ansible.builtin.user:
    name: "{{ node_user }}"
    comment: Ansible administrator
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Install administrator SSH public key
  ansible.posix.authorized_key:
    user: "{{ node_user }}"
    key: "{{ node_authorized_key }}"
    state: present

- name: Allow administrator to use passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ node_user }}"
    content: "{{ node_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
