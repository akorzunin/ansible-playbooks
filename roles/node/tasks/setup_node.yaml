---
- name: Require a supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: Bootstrap supports official Debian and Ubuntu images only.

- name: Set node hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Keep hostname resolvable locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
    owner: root
    group: root
    mode: "0644"

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install prerequisite and security packages
  ansible.builtin.apt:
    name:
      - apparmor
      - ca-certificates
      - curl
      - python3-apt
      - python3-debian
      - python3-pip
      - python3-requests
      - sshguard
      - unattended-upgrades
    state: present

- name: Enable periodic package indexes and unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

# Override package/provider origins instead of assuming unattended-upgrades defaults.
- name: Restrict unattended upgrades to distribution security repositories
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99node-security
    content: |
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      {% if ansible_facts.distribution == 'Debian' %}
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      {% else %}
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      {% endif %}
    owner: root
    group: root
    mode: "0644"

- name: Prevent unattended upgrades from rebooting the server
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99no-auto-reboot
    content: 'Unattended-Upgrade::Automatic-Reboot "false";'
    owner: root
    group: root
    mode: "0644"

- name: Enable security services and apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apparmor
    - sshguard
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Check AppArmor support in the running kernel
  ansible.builtin.command: aa-enabled
  register: node_apparmor_enabled
  changed_when: false
  failed_when: false

- name: Require active AppArmor before installing Docker
  ansible.builtin.assert:
    that: node_apparmor_enabled.rc == 0
    fail_msg: >-
      AppArmor is not active in the running kernel. Use an AppArmor-capable
      kernel, enable AppArmor in the image's kernel boot settings, reboot,
      and rerun bootstrap. No automatic reboot or bootloader change was made.

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read native Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: node_dpkg_architecture
  changed_when: false

- name: Add Docker GPG apt key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker apt repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ node_dpkg_architecture.stdout }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add administrator to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  notify: Update groups

- name: Create shared Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
  loop:
    - monitoring
    - main

# Key-only sudo was verified in a fresh connection before reaching this task.
# Prepend before Include/Match directives: OpenSSH uses the first value it reads.
- name: Disable root SSH and password authentication
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    marker: '# {mark} ANSIBLE NODE SSH POLICY'
    block: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    validate: /usr/sbin/sshd -t -f %s
    owner: root
    group: root
    mode: "0644"
  notify: Reload ssh service

- name: Check whether OS updates require a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: node_reboot_required
