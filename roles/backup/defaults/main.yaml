backup_create_base_dir: /srv/deploy
backup_service: all
backup_service_dir: "{{ backup_create_base_dir }}/{{ backup_service }}"
# Only these trees are archived. Add external volumes/configs explicitly.
backup_paths: "{{ [backup_create_base_dir] if backup_service == 'all' else [backup_service_dir] }}"
backup_file_name: "{{ backup_service }}-{{ backup_work_dir.path | basename }}.tar.gz"
backup_dest_path: "{{ backup_remote_name }}:/backups/{{ inventory_hostname }}/{{ backup_service }}/{{ backup_file_name }}"
backup_remote_name: "{{ rclone_remote_name | default('backup-remote') }}"
# Read existing configuration without creating/deleting remotes or exposing credentials.
backup_rclone_config_path: "{{ rclone_config_path | default('/home/' ~ ansible_user ~ '/.config/rclone/rclone.conf') }}"
