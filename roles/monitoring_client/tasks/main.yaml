---
- name: Require an explicit source allowlist for published Telegraf metrics
  ansible.builtin.assert:
    that:
      - monitoring_telegraf_allowed_sources | default([]) | length > 0
      - monitoring_client_telegraf_port | int > 0
    fail_msg: Load monitoring.inventory.yml and configure monitoring_telegraf_allowed_sources before publishing metrics.

- name: Deploy native Telegraf on hosts without Docker
  ansible.builtin.import_tasks: native.yaml
  when: monitoring_client_native | default(false) | bool

- name: Deploy containerized Telegraf
  ansible.builtin.import_tasks: compose.yaml
  when: not (monitoring_client_native | default(false) | bool)
