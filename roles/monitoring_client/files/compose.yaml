services:
  telegraf:
    image: ${TELEGRAF_IMAGE}
    container_name: telegraf
    user: root
    # Bypass the image's privilege drop to retain access to the host Docker socket.
    entrypoint: ["telegraf"]
    command: ["--config", "/etc/telegraf/telegraf.conf"]
    restart: unless-stopped
    environment:
      HOST_PROC: /hostproc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
      HOST_MOUNT_PREFIX: /hostfs
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro,rslave
      - /proc:/hostproc:ro
      - /proc/1/net:/hostproc/net:ro
      # Read-only bind does not make the Docker API read-only: root-equivalent access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${TELEGRAF_BIND_ADDRESS}:${TELEGRAF_PORT}:9273"
    labels:
      org.opencontainers.group: monitoring
