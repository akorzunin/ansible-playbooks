---
- name: Require a bootstrapped Debian x86 node and valid public names
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.architecture == 'x86_64'
      - ansible_user != 'root'
      - ansible_host_key_checking | default(false) | bool
      - vpn_node_name is match('^[a-z][a-z0-9-]{0,62}$')
      - vpn_node_domain is match('^(?=.{1,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - vpn_node_reality_server_name is match('^(?=.{1,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - vpn_node_vless_port | int in [443, 8443]
      - vpn_node_vless_fingerprint in ['chrome', 'firefox']
      - vpn_node_vless_port | int != 443 or vpn_node_shared_https | bool
      - vpn_node_vless_port | int != 443 or vpn_node_reality_server_name != vpn_node_domain
      # A self-target would recurse through the new SNI route back into REALITY.
      - vpn_node_vless_port | int != 443 or vpn_node_reality_handshake_address not in [vpn_node_public_address, vpn_node_domain]
      - vpn_node_ssh_port | int > 1024
      - vpn_node_ssh_port | int < 65536
      - vpn_node_ssh_port | int != ansible_port | default(22) | int
      - not vpn_node_hysteria2_enabled | bool or vpn_node_hysteria2_port | int > 0
      - not vpn_node_hysteria2_enabled | bool or vpn_node_hysteria2_port | int < 65536
      - not vpn_node_shared_https | bool or vpn_node_caddyfile | length > 0
    fail_msg: >-
      Use a bootstrapped Debian x86_64 node with strict host-key checking, a DNS hostname
      and a separate tunnel SSH port. VLESS port 443 requires shared HTTPS, a distinct SNI
      and an external handshake target.

- name: Require persistent Vault credentials before changing the node
  ansible.builtin.assert:
    that:
      - vpn_node_credentials.naive_username is match('^[a-zA-Z0-9_-]+$')
      - vpn_node_credentials.naive_password is match('^[a-zA-Z0-9_-]{24,}$')
      - vpn_node_credentials.vless_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - vpn_node_credentials.reality_private_key is match('^[a-zA-Z0-9_-]{43}$')
      - vpn_node_credentials.reality_public_key is match('^[a-zA-Z0-9_-]{43}$')
      - vpn_node_credentials.reality_short_id is match('^[0-9a-f]{16}$')
      - lookup('ansible.builtin.file', vpn_node_ssh_public_key_path) is match('^ssh-ed25519 ')
    fail_msg: Restore persistent VPN credentials and the dedicated tunnel key before deploying.
  no_log: true

- name: Derive the tunnel public key from the controller private key
  ansible.builtin.command:
    argv: [ssh-keygen, -y, -f, "{{ vpn_node_ssh_private_key_path }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  register: vpn_node_derived_key
  no_log: true

- name: Require the client tunnel key to match the authorized key
  ansible.builtin.assert:
    that: vpn_node_derived_key.stdout.split()[:2] == lookup('ansible.builtin.file', vpn_node_ssh_public_key_path).split()[:2]
  no_log: true

- name: Verify non-root administration without sudo
  ansible.builtin.command: id -u
  become: false
  register: vpn_node_identity
  changed_when: false
  failed_when: vpn_node_identity.rc != 0 or vpn_node_identity.stdout | int == 0

- name: Verify sudo access before deploying containers
  ansible.builtin.command: id -u
  register: vpn_node_sudo_identity
  changed_when: false
  failed_when: vpn_node_sudo_identity.rc != 0 or vpn_node_sudo_identity.stdout != '0'
